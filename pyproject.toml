[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exist2026-multimodal-sexism"
version = "1.0.0"
description = "Audited EXIST 2026 meme experiments and a reproducible multimodal baseline"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Serrano Team"}]
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
notebooks = [
  "ipykernel>=6,<7",
  "jupyterlab>=4,<5",
  "matplotlib>=3.8,<4",
  "pandas>=2.1,<3",
  "seaborn>=0.13,<1",
]
heavy = [
  "iterative-stratification>=0.1.9,<1",
  "lightgbm>=4,<5",
  "pyevall>=0.1.62,<1",
  "sentence-transformers>=3,<4",
  "timm>=1,<2",
  "torch>=2.2,<3",
  "transformers>=4.40,<5",
  "xgboost>=2,<4",
]
dev = [
  "black>=24.4,<26",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
exist2026-baseline = "exist2026.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["exist2026"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
